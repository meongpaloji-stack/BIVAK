<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIVAK — Marketplace Barter Gear Outdoor</title>
<meta name="description" content="BIVAK — Barter Item & Value Antar Komunitas. Prototipe marketplace barter gear outdoor untuk ekosistem Pintu Angin.">
<meta name="theme-color" content="#2783DE">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --text:#2C2C2B; --muted:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface2:#F0EFED; --border:#E6E5E3;
  --blue:#2783DE; --blue-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458; --red-soft:#FCE9E7;
  --purple:#8A5CC4; --purple-soft:#F1EAFB;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.wrap{max-width:1120px; margin:0 auto; padding:0 32px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- APP BAR ---------- */
.appbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.appbar .row{display:flex; align-items:center; gap:16px; height:64px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:0 0 auto}
.brand .mark{width:32px; height:32px; border-radius:9px; background:var(--blue); display:grid; place-items:center}
.brand b{font-size:17px; letter-spacing:.02em}
.brand small{display:block; font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; line-height:1}
.tabs{display:flex; gap:2px; margin-left:8px; overflow-x:auto; flex:1 1 auto; min-width:0; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:none; border:0; padding:10px 12px; border-radius:8px; color:var(--muted);
  font-size:14.5px; white-space:nowrap; position:relative;
}
.tabs button:hover{background:var(--soft); color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--blue-soft); color:#1d5f9f; font-weight:600}
.tabs .badge{
  display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:999px;
  background:var(--red); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center;
}
.spacer{flex:1}
.btn{
  white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
  padding:0 18px; border-radius:8px; border:1px solid var(--border); background:var(--canvas);
  color:var(--text); font-size:14.5px; font-weight:500; text-decoration:none; transition:.15s;
}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:#1f74c8}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:#a8423a; border-color:#f0cfcb; background:var(--red-soft)}
.btn.ok{color:#2f7550; border-color:#c9e2d3; background:var(--green-soft)}
.btn.sm{min-height:36px; padding:0 12px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.me{display:flex; align-items:center; gap:10px; padding-left:12px; border-left:1px solid var(--border)}
.avatar{
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  background:var(--blue-soft); color:#1d5f9f; font-weight:700; font-size:13.5px; flex:0 0 auto;
}
.avatar.lg{width:52px; height:52px; font-size:17px}
.me .who{font-size:13.5px; line-height:1.25}
.me .who span{display:block; color:var(--muted); font-size:12.5px}

/* ---------- HERO ---------- */
.hero{background:var(--soft); border-bottom:1px solid var(--border); padding:36px 0 28px}
.hero .inner{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--blue); background:var(--blue-soft);
  border-radius:999px; padding:6px 12px; margin-bottom:16px;
}
h1{font-size:38px; line-height:1.08; letter-spacing:-.02em; margin:0 0 10px}
.hero p{margin:0; color:var(--muted); font-size:16.5px; max-width:52ch}
.searchbar{
  display:flex; align-items:center; gap:10px; margin-top:20px; background:var(--canvas);
  border:1px solid var(--border); border-radius:10px; padding:6px 6px 6px 14px; box-shadow:var(--shadow);
}
.searchbar{flex-wrap:wrap}
.searchbar input{flex:1 1 140px; min-width:0; border:0; outline:0; background:none; min-height:38px; font-size:15px}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.stat{background:var(--canvas); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:13.5px; color:var(--muted)}
.stat b{color:var(--text)}
.hero-art{position:relative; height:220px}
.hero-art .tile{
  position:absolute; border-radius:14px; border:1px solid var(--border); overflow:hidden; line-height:0;
  background:var(--canvas); box-shadow:var(--shadow); aspect-ratio:4/3;
}
.hero-art .t1{width:56%; left:0; top:8px; transform:rotate(-3deg)}
.hero-art .t2{width:52%; right:2%; top:0; transform:rotate(4deg)}
.hero-art .t3{width:46%; left:24%; bottom:0; transform:rotate(-1deg)}
.hero-art .swap{
  position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff;
  display:grid; place-items:center; box-shadow:0 6px 18px rgba(39,131,222,.35); z-index:2;
}

/* ---------- LAYOUT ---------- */
main{padding:28px 0 64px}
.section-head{display:flex; align-items:flex-end; gap:16px; margin:0 0 16px}
.section-head h2{margin:0; font-size:22px; letter-spacing:-.01em}
.section-head p{margin:2px 0 0; color:var(--muted); font-size:14.5px}
.section-head .spacer{flex:1}
h3.k{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 10px}

.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px}
.chip{
  border:1px solid var(--border); background:var(--canvas); border-radius:999px;
  padding:8px 14px; font-size:13.5px; color:var(--muted); white-space:nowrap; min-height:38px;
}
.chip:hover{background:var(--soft); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:#fff; font-weight:500}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12.5px; color:var(--muted); font-weight:500}
.field select,.field input,.field textarea{
  border:1px solid var(--border); border-radius:8px; background:var(--canvas);
  padding:10px 12px; min-height:44px; outline:0;
}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
.field textarea{min-height:92px; resize:vertical}
.hint{font-size:12.5px; color:var(--muted)}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
.grid.two{grid-template-columns:repeat(2,1fr)}

/* ---------- CARD ---------- */
.card{
  background:var(--canvas); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; transition:.18s;
}
.card.pad{padding:20px}
.card.hoverable:hover{box-shadow:var(--shadow); transform:translateY(-2px); border-color:#dcdbd8}
.thumb{position:relative; aspect-ratio:4/3; background:var(--surface2); overflow:hidden; line-height:0}
.thumb svg,.thumb img{width:100%; height:100%; object-fit:cover}
.thumb .tags{position:absolute; left:10px; top:10px; display:flex; gap:6px; flex-wrap:wrap}
.thumb .fav{
  position:absolute; right:10px; top:10px; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:rgba(255,255,255,.92); display:grid; place-items:center;
}
.tag{
  font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  background:rgba(255,255,255,.94); border:1px solid var(--border); color:var(--muted);
  border-radius:6px; padding:4px 8px;
}
.tag.b{background:var(--blue-soft); border-color:#cfe6f9; color:#1d5f9f}
.tag.g{background:var(--green-soft); border-color:#c9e2d3; color:#2f7550}
.tag.o{background:var(--orange-soft); border-color:#f2ddc7; color:#9c5a24}
.tag.p{background:var(--purple-soft); border-color:#e2d4f6; color:#6b45a0}
.card .body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
.card h4{margin:0; font-size:16.5px; line-height:1.3}
.meta{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); flex-wrap:wrap}
.value{font-size:18px; font-weight:600; letter-spacing:-.01em}
.wants{font-size:13.5px; color:var(--muted); background:var(--soft); border-radius:8px; padding:8px 10px}
.wants b{color:var(--text); font-weight:600}
.card .foot{display:flex; gap:8px; margin-top:auto}
.card .foot .btn{flex:1}
.match{display:flex; align-items:center; gap:8px; font-size:13px; color:#2f7550; background:var(--green-soft); border-radius:8px; padding:8px 10px}

.pill{text-transform:capitalize; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:500; background:var(--surface2); display:inline-block}
.pill.b{background:var(--blue-soft); color:#1d5f9f}
.pill.g{background:var(--green-soft); color:#2f7550}
.pill.o{background:var(--orange-soft); color:#9c5a24}
.pill.r{background:var(--red-soft); color:#a8423a}
.pill.p{background:var(--purple-soft); color:#6b45a0}

.empty{
  border:1px dashed var(--border); border-radius:var(--radius); padding:40px 24px;
  text-align:center; color:var(--muted); background:var(--soft);
}
.empty b{display:block; color:var(--text); margin-bottom:4px; font-size:16px}

/* ---------- MODAL ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(28,28,27,.45); z-index:60;
  display:flex; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto;
}
.scrim[hidden]{display:none}
.sheet{
  background:var(--canvas); border-radius:16px; width:100%; max-width:900px;
  box-shadow:0 24px 60px rgba(0,0,0,.22); overflow:hidden;
}
.sheet .head{
  display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--canvas); z-index:2;
}
.sheet .head h3{margin:0; font-size:17px; flex:1}
.sheet .content{padding:24px}
.iconbtn{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--border);
  background:var(--canvas); display:grid; place-items:center;
}
.iconbtn:hover{background:var(--soft)}
.detail{display:grid; grid-template-columns:1.05fr .95fr; gap:28px}
.detail .gal{border:1px solid var(--border); border-radius:12px; overflow:hidden; aspect-ratio:4/3; background:var(--surface2)}
.detail .gal svg,.detail .gal img{width:100%;height:100%;object-fit:cover}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14.5px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.owner{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--soft)}
.owner .n{flex:1; font-size:14.5px}
.owner .n span{display:block; color:var(--muted); font-size:13px}
.pickrow{
  display:flex; align-items:center; gap:12px; border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--canvas);
}
.pickrow:hover{background:var(--soft)}
.pickrow input{width:20px; height:20px; accent-color:var(--blue)}
.pickrow .t{flex:1; font-size:14.5px}
.pickrow .t span{display:block; color:var(--muted); font-size:13px}
.calc{background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:16px; display:grid; gap:8px; font-size:14.5px}
.calc .line{display:flex; justify-content:space-between; gap:12px}
.calc .line.total{border-top:1px solid var(--border); padding-top:8px; font-weight:600}

/* ---------- CHAT ---------- */
.thread{display:grid; grid-template-columns:1fr; gap:12px; max-height:320px; overflow-y:auto; padding:4px 2px}
.msg{max-width:78%; padding:10px 14px; border-radius:14px; font-size:14.5px; background:var(--surface2)}
.msg .who{display:block; font-size:11.5px; color:var(--muted); margin-bottom:2px}
.msg.mine{margin-left:auto; background:var(--blue-soft); color:#17548c}
.msg.sys{margin:0 auto; background:var(--soft); border:1px dashed var(--border); color:var(--muted); font-size:13px; text-align:center}
.composer{display:flex; gap:8px; margin-top:12px}
.composer input{flex:1; border:1px solid var(--border); border-radius:8px; padding:0 12px; min-height:44px; outline:0}
.composer input:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}
.steps{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.steps .s{padding:5px 10px; border-radius:999px; background:var(--surface2)}
.steps .s.on{background:var(--blue); color:#fff; font-weight:600}
.steps .s.done{background:var(--green-soft); color:#2f7550}

/* ---------- PHOTOS PICKER ---------- */
.photos{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.photo{
  aspect-ratio:1; border:1px dashed var(--border); border-radius:10px; background:var(--soft);
  display:grid; place-items:center; position:relative; overflow:hidden; color:var(--muted); font-size:13px; text-align:center;
}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.photo .x{position:absolute; right:6px; top:6px; width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,.94)}

/* ---------- TOAST ---------- */
.toasts{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80; display:grid; gap:8px; width:min(92vw,420px)}
.toast{
  background:var(--text); color:#fff; border-radius:10px; padding:12px 16px; font-size:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.2); display:flex; gap:10px; align-items:center;
}
.toast.ok{background:#2f7550}
.toast.warn{background:#9c5a24}

footer{border-top:1px solid var(--border); padding:24px 0 40px; color:var(--muted); font-size:13.5px}
footer .row{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero .inner{grid-template-columns:1fr}
  .hero-art{display:none}
  .detail{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{overflow-x:hidden}
  .wrap{padding:0 20px}
  h1{font-size:26px}
  .hero{padding:24px 0 22px}
  .appbar .row > .btn.primary{display:none}
  .searchbar{padding:10px}
  .searchbar .btn{width:100%}
  .toolbar .field{flex:1 1 44%}
  .sheet{border-radius:12px}
  .scrim{padding:12px 8px}
  .grid,.grid.two{grid-template-columns:1fr}
  .appbar .row{height:auto; padding:10px 0; flex-wrap:wrap}
  .me .who{display:none}
  .tabs{order:3; width:100%; margin-left:0}
  .sheet .content{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important} html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap row">
    <a class="brand" href="#" onclick="go('beranda');return false">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L21 20 H3 Z" fill="#E5F2FC"/><path d="M12 4 L16.5 12 H7.5 Z" fill="#fff"/></svg></span>
      <span><b>BIVAK</b><small>Barter gear outdoor</small></span>
    </a>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <span class="spacer"></span>
    <button class="btn primary" onclick="go('tambah')">+ Tambah barang</button>
    <div class="me">
      <span class="avatar" id="meAvatar">NI</span>
      <span class="who"><b id="meName">—</b><span id="meCity">—</span></span>
    </div>
  </div>
</header>

<div id="view"></div>

<footer>
  <div class="wrap row">
    <span><b>BIVAK</b> — Barter Item &amp; Value Antar Komunitas · Prototipe MVP</span>
    <span>Ekosistem Pintu Angin · Reichas Chelebes · Makassar–Gowa</span>
  </div>
</footer>

<div class="scrim" id="scrim" hidden onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="head">
      <h3 id="sheetTitle">Detail</h3>
      <button class="iconbtn" onclick="closeSheet()" aria-label="Tutup">✕</button>
    </div>
    <div class="content" id="sheetBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* =========================================================
   BIVAK — prototipe marketplace barter gear outdoor
   Data disimpan di localStorage (tanpa backend).
   Skema mengikuti dokumen rancangan MVP:
   barter_profiles / barter_listings / barter_wants /
   barter_offers / barter_offer_items / barter_messages /
   barter_transactions / barter_reports
   ========================================================= */

const CATS = ["Carrier","Tas daypack","Sepatu gunung","Sleeping bag","Tenda","Matras","Trekking pole","Headlamp","Jas hujan","Perlengkapan memasak"];
const CITIES = ["Makassar","Gowa","Maros","Takalar","Sinjai"];
const CONDS = ["Baru","Seperti baru","Bekas terawat","Bekas layak pakai"];
const ME = "u1";
const KEY = "bivak.v1";

const rp = n => "Rp" + (n||0).toLocaleString("id-ID");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
const ago = t => {
  const d = (Date.now()-t)/6e4;
  if(d<1) return "baru saja"; if(d<60) return Math.floor(d)+" mnt lalu";
  if(d<1440) return Math.floor(d/60)+" jam lalu"; return Math.floor(d/1440)+" hari lalu";
};
const initials = n => n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ---------- ilustrasi vektor per kategori ---------- */
const ART = {
  "Carrier":["#E5F2FC","#2783DE","M34 28h32c4 0 6 3 6 7v34c0 5-3 8-8 8H36c-5 0-8-3-8-8V35c0-4 2-7 6-7z M42 28c0-7 4-10 8-10s8 3 8 10 M34 46h32 M44 62h12v10H44z"],
  "Tas daypack":["#F1EAFB","#8A5CC4","M36 32h28c5 0 7 4 7 9v29c0 5-3 8-8 8H37c-5 0-8-3-8-8V41c0-5 2-9 7-9z M43 32c0-8 3-12 7-12s7 4 7 12 M38 56h24v14H38z"],
  "Sepatu gunung":["#FBEBDE","#D5803B","M18 62c0-8 6-10 8-16l4-14h14l3 14c8 3 22 6 30 10 4 2 5 5 5 8v6H18z M26 46h16 M30 34l-2-8"],
  "Sleeping bag":["#E8F1EC","#46A171","M30 34c0-7 5-12 12-12h16c7 0 12 5 12 12v32c0 8-5 12-12 12H42c-7 0-12-5-12-12z M30 50h40 M50 22v56"],
  "Tenda":["#E8F1EC","#46A171","M12 76 50 22l38 54z M50 22v54 M36 76l14-26 14 26 M12 76h76"],
  "Matras":["#F0EFED","#7D7A75","M16 40h68c4 0 6 3 6 8s-2 8-6 8H16c-4 0-6-3-6-8s2-8 6-8z M30 40v16 M44 40v16 M58 40v16 M72 40v16"],
  "Trekking pole":["#E5F2FC","#2783DE","M36 16h10l-4 60-6 8z M62 16h10l-4 60-6 8z M36 34h10 M62 34h10 M36 54h10 M62 54h10"],
  "Headlamp":["#FBEBDE","#D5803B","M28 44a22 22 0 0 1 44 0v14a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8z M44 52h12v14H44z M14 52h10 M76 52h10 M22 34l8 6 M78 34l-8 6"],
  "Jas hujan":["#E5F2FC","#2783DE","M50 20c8 0 10 6 18 10l10 6-6 14-6-3v33H34V47l-6 3-6-14 10-6c8-4 10-10 18-10z M50 20v58"],
  "Perlengkapan memasak":["#F0EFED","#7D7A75","M24 40h40v22c0 8-5 12-12 12H36c-7 0-12-4-12-12z M64 46h12v10H64z M32 40V28 M44 40V24 M56 40V28"]
};
function art(cat, seed=0){
  const a = ART[cat] || ART["Matras"];
  const rot = (seed%2 ? 4 : -3);
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi '+esc(cat)+'">'
    + '<rect width="100" height="100" fill="'+a[0]+'"/>'
    + '<circle cx="'+(seed%2?88:12)+'" cy="92" r="50" fill="#FFFFFF" opacity=".6"/>'
    + '<circle cx="'+(seed%2?76:24)+'" cy="18" r="24" fill="'+a[1]+'" opacity=".09"/>'
    + '<g transform="translate(50 50) scale(.74) rotate('+rot+') translate(-50 -50)" fill="none" stroke="'+a[1]+'" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity=".92"><path d="'+a[2]+'"/></g>'
    + '</svg>';
}
function thumbOf(l, cls){
  if(l.photos && l.photos.length) return '<img src="'+l.photos[0]+'" alt="'+esc(l.title)+'">';

}

let db = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const s = seed(); save(s); return s;
}
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d||db)); }catch(e){} }
function resetAll(){ localStorage.removeItem(KEY); db = load(); go(state.tab); toast("Data prototipe dikembalikan ke awal","warn"); }

/* ---------- helpers ---------- */
const prof = id => db.profiles.find(p=>p.id===id) || {name:"?", city:"-", reputation:0};
const listing = id => db.listings.find(l=>l.id===id);
const myListings = () => db.listings.filter(l=>l.ownerId===ME);
const incoming = () => db.offers.filter(o=>{const t=listing(o.targetListingId); return t && t.ownerId===ME});
const outgoing = () => db.offers.filter(o=>o.proposerId===ME);
const openStatuses = ["Diajukan","Negosiasi","Disetujui"];
const pillClass = s => ({"Diajukan":"b","Negosiasi":"o","Disetujui":"p","Selesai":"g","Ditolak":"r","Dibatalkan":"r","Tidak terpilih":""}[s]||"");
function offerValue(o){ return o.items.reduce((a,i)=>a+i.valueSnapshot,0); }
function matchReason(l){
  const mine = myListings().filter(m=>m.status==="aktif");
  for(const w of (l.wants||[])){
    for(const m of mine){
      const catOk = w.category===m.category;
      const kwOk = w.keyword && m.title.toLowerCase().includes(String(w.keyword).toLowerCase().split(" ")[0]);
      const valOk = (!w.min || m.appraisedValue>=w.min*0.8) && (!w.max || m.appraisedValue<=w.max*1.25);
      if((catOk||kwOk) && valOk) return {listing:m, want:w};
    }
  }
  return null;
}

/* ---------- toast ---------- */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " "+kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

function filtered(){
  let rows = db.listings.filter(l=>l.ownerId!==ME && (l.status==="aktif"||l.status==="dicadangkan"));
  const q = state.q.trim().toLowerCase();
  if(q) rows = rows.filter(l=>(l.title+" "+l.category+" "+l.description+" "+l.city).toLowerCase().includes(q));
  if(state.cat!=="Semua") rows = rows.filter(l=>l.category===state.cat);
  if(state.cond!=="Semua") rows = rows.filter(l=>l.condition===state.cond);
  if(state.city!=="Semua") rows = rows.filter(l=>l.city===state.city);
  if(state.vmax) rows = rows.filter(l=>l.appraisedValue<=state.vmax);
  rows.sort((a,b)=> state.sort==="murah" ? a.appraisedValue-b.appraisedValue
    : state.sort==="mahal" ? b.appraisedValue-a.appraisedValue : b.createdAt-a.createdAt);
  return rows;
}

let draftPhotos = [];
function paintPhotos(){
  const box = document.getElementById("photos"); if(!box) return;
  const slots = [0,1,2].map(i=> draftPhotos[i]
    ? `<div class="photo"><img src="${draftPhotos[i]}" alt="Foto ${i+1}"><button type="button" class="x" aria-label="Hapus foto" onclick="draftPhotos.splice(${i},1);paintPhotos()">✕</button></div>`
    : `<div class="photo">Slot ${i+1}</div>`);
  box.innerHTML = slots.join("");
}
function addPhotos(files){
  [...files].slice(0, 3-draftPhotos.length).forEach(f=>{
    if(!f.type.startsWith("image/")){ toast("Hanya file gambar yang diizinkan","warn"); return; }
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        const s = Math.min(1, 900/Math.max(img.width,img.height));
        cv.width = img.width*s; cv.height = img.height*s;
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        draftPhotos.push(cv.toDataURL("image/webp",.72)); paintPhotos();
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
  if(files.length > 3-draftPhotos.length) toast("Maksimal 3 foto per listing","warn");
}

function submitListing(ev){
  ev.preventDefault();
  const g = id => document.getElementById(id).value;
  const today = db.listings.filter(l=>l.ownerId===ME && Date.now()-l.createdAt < 864e5).length;
  if(today >= 5){ toast("Batas 5 listing baru per hari tercapai","warn"); return; }
  const val = +g("v");
  if(!val || val < 10000){ toast("Nilai taksasi minimal Rp10.000","warn"); return; }
  const l = {
    id:uid("l"), ownerId:ME, title:g("t").trim(), category:g("c"), condition:g("k"),
    appraisedValue:val, city:g("kt"), description:g("d").trim(), status:"aktif",
    photos:draftPhotos.slice(0,3), favorite:false, createdAt:Date.now(),
    wants:[{category:g("wc"), keyword:g("wk").trim(), min:+g("wmin")||0, max:+g("wmax")||0}]
  };
  db.listings.unshift(l); save(); draftPhotos = [];
  toast("Listing dipublikasikan · status Aktif","ok");
  go("profil");
}

function paintPick(){
  const avail = myListings().filter(l=>l.status==="aktif");
  const box = document.getElementById("pickList"); if(!box) return;
  box.innerHTML = avail.length ? avail.map(l=>`<label class="pickrow">
      <input type="checkbox" ${pick.items.includes(l.id)?"checked":""} onchange="togglePick('${l.id}',this.checked)">
      <span style="width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:0 0 auto">${thumbOf(l)}</span>
      <span class="t"><b>${esc(l.title)}</b><span>${esc(l.category)} · ${rp(l.appraisedValue)}</span></span>
    </label>`).join("")
    : `<div class="empty">Kamu belum punya barang aktif untuk ditawarkan. <button class="btn sm primary" style="margin-top:10px" onclick="closeSheet();go('tambah')">Tambah barang</button></div>`;
}
function togglePick(id, on){
  pick.items = on ? [...new Set([...pick.items, id])] : pick.items.filter(x=>x!==id);
  paintCalc();
}
function paintCalc(){
  const box = document.getElementById("calcBox"); if(!box) return;
  const t = listing(pick.targetId);
  const give = pick.items.map(listing).reduce((a,l)=>a+l.appraisedValue,0);
  const diff = t.appraisedValue - give;
  const after = diff - pick.cash;
  const c = document.getElementById("cash");
  if(c && !pick.cashTouched){ pick.cash = pick.items.length ? Math.max(0, diff) : 0; c.value = pick.cash; }
  box.innerHTML = `<div class="calc">
    <div class="line"><span>Nilai barangmu (${pick.items.length} barang)</span><b>${rp(give)}</b></div>
    <div class="line"><span>Nilai barang diminta</span><b>${rp(t.appraisedValue)}</b></div>
    <div class="line"><span>Usulan tunai</span><b>${rp(pick.cash)}</b></div>
    <div class="line total"><span>${!pick.items.length?"Pilih barang dulu":Math.abs(after)<1?"Penawaran seimbang":after>0?"Masih kurang":"Kelebihan nilai"}</span><b>${!pick.items.length?"—":Math.abs(after)<1?"✓ adil":rp(Math.abs(after))}</b></div>
  </div>`;
}
function submitOffer(){

  const o = {
    id:uid("o"), targetListingId:t.id, proposerId:ME,
    items:pick.items.map(id=>({listingId:id, valueSnapshot:listing(id).appraisedValue})),
    cashAdjustment:pick.cash, note, status:"Diajukan", createdAt:Date.now(),
    messages:[
      {id:uid("m"), from:ME, body: note || "Saya ajukan barter untuk barang ini.", at:Date.now()},
      {id:uid("m"), from:"sys", body:"Penawaran diajukan · menunggu respons pemilik", at:Date.now()}

  };
  db.offers.unshift(o); save(); closeSheet();
  state.box = "terkirim"; go("penawaran");
  toast("Penawaran terkirim ke "+prof(t.ownerId).name,"ok");
}

/* ---------- negosiasi ---------- */
const FLOW = ["Diajukan","Negosiasi","Disetujui","Selesai"];
function openOffer(id){
  state.openOffer = id;
  const o = db.offers.find(x=>x.id===id), t = listing(o.targetListingId);
  const iAmOwner = t.ownerId===ME;
  const other = iAmOwner ? prof(o.proposerId) : prof(t.ownerId);
  const idx = FLOW.indexOf(o.status);
  const closed = ["Ditolak","Dibatalkan","Tidak terpilih","Selesai"].includes(o.status);
  const acts = [];
  if(iAmOwner){
    if(o.status==="Diajukan") acts.push(["Mulai negosiasi","setStatus('"+id+"','Negosiasi')",""],["Setujui barter","setStatus('"+id+"','Disetujui')","ok"],["Tolak","setStatus('"+id+"','Ditolak')","danger"]);
    if(o.status==="Negosiasi") acts.push(["Setujui barter","setStatus('"+id+"','Disetujui')","ok"],["Tolak","setStatus('"+id+"','Ditolak')","danger"]);
    if(o.status==="Disetujui") acts.push(["Tandai selesai","setStatus('"+id+"','Selesai')","ok"]);
  }else{
    if(o.status==="Diajukan"||o.status==="Negosiasi") acts.push(["Batalkan penawaran","setStatus('"+id+"','Dibatalkan')","danger"]);
    if(o.status==="Disetujui") acts.push(["Konfirmasi barter selesai","setStatus('"+id+"','Selesai')","ok"]);
  }
  const body = `
    <div class="steps" style="margin-bottom:16px">
      ${FLOW.map((s,i)=>`<span class="s ${o.status===s?"on":(idx>i?"done":"")}">${s}</span>${i<FLOW.length-1?"<span>→</span>":""}`).join("")}
      ${closed && o.status!=="Selesai"?`<span class="pill r" style="margin-left:8px">${o.status}</span>`:""}
    </div>
    <div class="grid two" style="gap:24px;align-items:start">
      <div>
        <div class="owner" style="margin-bottom:14px">
          <span class="avatar">${initials(other.name)}</span>
          <span class="n"><b>${esc(other.name)}</b><span>${esc(other.city)} · ★ ${other.reputation.toFixed(1)}</span></span>
          <span class="pill ${pillClass(o.status)}">${o.status}</span>
        </div>
        <h3 class="k">Isi penawaran</h3>
        <div style="display:grid;gap:8px">
          ${o.items.map(i=>{const l=listing(i.listingId); return `<div class="pickrow" style="cursor:default">
            <span style="width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:0 0 auto">${thumbOf(l)}</span>
            <span class="t"><b>${esc(l.title)}</b><span>Ditawarkan · ${rp(i.valueSnapshot)}</span></span></div>`}).join("")}
          <div style="text-align:center;color:var(--muted)">⇅</div>
          <div class="pickrow" style="cursor:default;border-color:#cfe6f9;background:var(--blue-soft)">
            <span style="width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:0 0 auto">${thumbOf(t)}</span>
            <span class="t"><b>${esc(t.title)}</b><span>Diminta · ${rp(t.appraisedValue)}</span></span></div>
        </div>
        <div class="calc" style="margin-top:14px">
          <div class="line"><span>Total nilai ditawarkan</span><b>${rp(offerValue(o))}</b></div>
          <div class="line"><span>Usulan tunai</span><b>${rp(Math.abs(o.cashAdjustment))} ${o.cashAdjustment>=0?"dari penawar":"dari pemilik"}</b></div>
          <div class="line total"><span>Posisi akhir</span><b>${(()=>{const d=t.appraisedValue-offerValue(o)-o.cashAdjustment; return Math.abs(d)<1?"✓ seimbang":rp(Math.abs(d))+(d>0?" kurang":" lebih")})()}</b></div>
        </div>
        ${acts.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${acts.map(([lab,fn,cls])=>`<button class="btn sm ${cls}" onclick="${fn}">${lab}</button>`).join("")}</div>`
          :`<div class="empty" style="margin-top:14px;padding:18px">Penawaran ini sudah ditutup dengan status <b>${o.status}</b>.</div>`}
      </div>
      <div>
        <h3 class="k">Chat penawaran</h3>
        <div class="thread" id="thread">
          ${o.messages.map(m=>m.from==="sys"
            ? `<div class="msg sys">${esc(m.body)}</div>`
            : `<div class="msg ${m.from===ME?"mine":""}"><span class="who">${esc(prof(m.from).name)} · ${ago(m.at)}</span>${esc(m.body)}</div>`).join("")}
        </div>
        ${closed?`<div class="hint" style="margin-top:12px">Chat ditutup karena penawaran sudah ${o.status.toLowerCase()}.</div>`
        :`<div class="composer">
          <input id="msg" placeholder="Tulis pesan…" onkeydown="if(event.key==='Enter')sendMsg('${id}')">
          <button class="btn primary" onclick="sendMsg('${id}')">Kirim</button>
        </div>
        <div class="hint" style="margin-top:8px">Hanya kamu dan ${esc(other.name)} yang dapat membaca chat ini (RLS).</div>`}
      </div>
    </div>`;
  openSheet("Negosiasi barter", body);
  const th = document.getElementById("thread"); if(th) th.scrollTop = th.scrollHeight;
}
function sendMsg(id){
  const inp = document.getElementById("msg"), body = inp.value.trim();
  if(!body) return;
  const o = db.offers.find(x=>x.id===id);
  o.messages.push({id:uid("m"), from:ME, body, at:Date.now()});
  if(o.status==="Diajukan") o.status = "Negosiasi";
  save(); openOffer(id);
  const other = listing(o.targetListingId).ownerId===ME ? o.proposerId : listing(o.targetListingId).ownerId;
  setTimeout(()=>{
    const cur = db.offers.find(x=>x.id===id);
    if(!cur || ["Ditolak","Dibatalkan","Selesai"].includes(cur.status)) return;
    const replies = ["Siap, saya cek dulu kondisinya ya.","Bisa. Bagaimana kalau bertemu di Karebosi Sabtu pagi?","Kalau selisihnya bisa dibulatkan, saya setuju.","Boleh kirim foto tambahan bagian jahitan?"];
    cur.messages.push({id:uid("m"), from:other, body:replies[Math.floor(Math.random()*replies.length)], at:Date.now()});
    save();
    if(state.openOffer===id) openOffer(id); else toast(prof(other).name+" mengirim pesan baru");
  }, 1400);
}
function setStatus(id, status){
  const o = db.offers.find(x=>x.id===id), t = listing(o.targetListingId);
  o.status = status;
  o.messages.push({id:uid("m"), from:"sys", body:"Status penawaran berubah menjadi "+status, at:Date.now()});
  if(status==="Disetujui"){
    t.status = "dicadangkan";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l) l.status="dicadangkan"; });
    toast("Barter disetujui · barang dicadangkan","ok");
  }
  if(status==="Selesai"){
    t.status = "selesai";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l) l.status="selesai"; });
    db.offers.filter(x=>x.targetListingId===t.id && x.id!==o.id && openStatuses.includes(x.status))
      .forEach(x=>{ x.status="Tidak terpilih"; x.messages.push({id:uid("m"),from:"sys",body:"Listing sudah selesai dibarter · penawaran tidak terpilih",at:Date.now()}); });
    db.transactions.push({id:uid("tx"), offerId:o.id, status:"selesai", agreedAt:Date.now(), completedAt:Date.now()});
    const me = prof(ME); me.deals += 1; me.reputation = Math.min(5, +(me.reputation + .05).toFixed(2));
    toast("Barter selesai · reputasi diperbarui","ok");
  }
  if(status==="Ditolak"||status==="Dibatalkan"){
    if(t.status==="dicadangkan") t.status="aktif";
    o.items.forEach(i=>{ const l=listing(i.listingId); if(l && l.status==="dicadangkan") l.status="aktif"; });
    toast("Penawaran "+status.toLowerCase()+" · listing kembali aktif","warn");
  }
  save(); openOffer(id); renderTabs();
}

render();
paintPhotos();
</script>
</body>
</html>
